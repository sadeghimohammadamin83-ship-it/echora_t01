name: Android APK

on:
  push:
    branches: [main, claude/project-thread-zmkkk0]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp -r assets www/
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ECHORA.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ECHORA-apk
          path: ECHORA.apk
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest ECHORA.apk --target "$GITHUB_SHA" --prerelease \
            --title "ECHORA Android APK" --notes "Debug APK built from $GITHUB_SHA"
